[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "siren-debug"
version = "0.6.0"
description = "Minimalist debug tool for Python with automatic cleaner"
readme = "README.md"
authors = [
    { name = "Alexandra Bona Abreu" }
]
license = { text = "MIT" }
requires-python = ">=2.7,!=3.0.*,!=3.1.*,!=3.2.*,!=3.3.*,!=3.4.*,!=3.5.*"
classifiers = [
    "Programming Language :: Python :: 2",
    "Programming Language :: Python :: 2.7",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = []

[project.scripts]
siren-clean = "siren.clean:main"
siren-autoload = "siren.autoload:main"
siren-scaffold = "siren.scaffold:main"
siren-env = "siren.envtool:main"
siren-snippet = "siren.snippets:main"
siren-http = "siren.http_client:main"
siren-quality = "siren.quality:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["siren*"]