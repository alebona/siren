name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    
    strategy:
      # Report every combination instead of cancelling the rest on the first failure.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
    
    - name: Run tests
      run: |
        python -m unittest discover -s tests -v

    - name: Legacy project smoke test
      run: python tests/smoke_legacy.py

  # Many teams still run Python 2.7 codebases. setup-python no longer ships
  # 2.7, so run the smoke test in the official image instead.
  python27:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Legacy project smoke test on Python 2.7
      run: docker run --rm -v "$PWD:/src" -w /src python:2.7 python tests/smoke_legacy.py

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: vscode/package-lock.json

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: npm ci

    - name: Unit tests
      run: npm test

    - name: Integration tests (real VS Code)
      run: xvfb-run -a npm run test:integration
