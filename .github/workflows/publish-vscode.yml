name: Publish VS Code extension

# Tags for the extension are vscode-v<version> (e.g. vscode-v1.0.0).
# Plain v* tags still publish the siren-debug Python package (publish.yml).
on:
  push:
    tags:
      - 'vscode-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: vscode/package-lock.json

    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: npm ci

    - name: Check the tag matches package.json
      run: |
        expected="vscode-v$(node -p "require('./package.json').version")"
        if [ "$GITHUB_REF_NAME" != "$expected" ]; then
          echo "Tag $GITHUB_REF_NAME does not match package.json ($expected)"; exit 1
        fi

    - name: Test
      run: |
        npm test
        xvfb-run -a npm run test:integration

    - name: Package
      run: npx vsce package -o siren.vsix

    - name: Publish to the VS Code Marketplace
      run: npx vsce publish --packagePath siren.vsix
      env:
        VSCE_PAT: ${{ secrets.VSCE_PAT }}

    - name: Publish to Open VSX (VSCodium, Cursor, Windsurf)
      run: npx --yes ovsx@0.10.1 publish siren.vsix
      env:
        OVSX_PAT: ${{ secrets.OVSX_PAT }}
